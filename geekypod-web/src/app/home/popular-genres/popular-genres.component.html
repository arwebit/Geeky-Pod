<div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
  <div
    class="rounded-lg p-6 text-black cursor-pointer bg-cover bg-center bg-no-repeat card-hover"
    [ngStyle]="{
      'background-image': 'url(' + imageURL + '/' + genre.genre_image + ')'
    }"
    *ngFor="let genre of genres"
    (click)="genrePage(genre.genre_slug)"
  >
    <div class="text-4xl mb-4">&nbsp;</div>
    <h3 class="text-xl font-semibold mb-2">&nbsp;</h3>
  </div>
</div>
