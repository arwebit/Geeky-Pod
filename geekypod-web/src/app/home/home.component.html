<header class="gradient-bg text-white">
  <div class="container mx-auto px-6 py-8">
    <div class="text-center">
      <h3
        class="logo-text flex items-center justify-center gap-3 text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl mb-4"
      >
        <img
          src="/img/logo.png"
          alt="Logo"
          class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24"
        />
        <span>The Geeky Pod</span>
      </h3>
      <p class="text-xl opacity-90 mb-6">
        Technology, Software, Career, Experiences & More
      </p>
      <div class="flex justify-center space-x-4">
        <a
          [href]="youtubeLink"
          target="_blank"
          class="bg-red-500 hover:bg-red-600 px-6 py-3 rounded-full font-semibold transition duration-300 flex items-center text-black"
        >
          <i class="fab fa-youtube"></i> &nbsp; YouTube
        </a>
        <a
          [href]="spotifyLink"
          target="_blank"
          class="bg-green-400 hover:bg-green-500 px-6 py-3 rounded-full font-semibold transition duration-300 flex items-center text-black"
        >
          <i class="fab fa-spotify"></i> &nbsp; Spotify
        </a>
      </div>
    </div>
  </div>
</header>

<!-- Latest Episodes Section -->
<section class="container mx-auto px-6 py-12">
  <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">
    🔥 Latest Episodes
  </h2>
  <app-latest-podcast></app-latest-podcast>
</section>

<!-- Browse by Genre Section -->
<section class="bg-white py-12">
  <div class="container mx-auto px-6">
    <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">
      🎯 Browse by Genre
    </h2>

    <app-popular-genres></app-popular-genres>
  </div>
</section>

<!-- Browse by Topics Section -->
<section class="container mx-auto px-6 py-12">
  <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">
    📋 Popular Podcasts
  </h2>
  <app-popular-podcasts></app-popular-podcasts>
</section>

<!-- Footer -->
<footer class="bg-gray-800 text-white py-8">
  <div class="container mx-auto px-6">
    <div class="text-center">
      <h3 class="text-2xl font-bold mb-4" style="color: aliceblue">
        🎧 The Geeky Pod
      </h3>
      <p class="text-gray-300 mb-6">
        Stay connected for the latest in geek culture!
      </p>
      <div class="flex justify-center space-x-6 mb-6">
        <a
          [href]="youtubeLink"
          target="_blank"
          class="bg-red-500 hover:bg-red-600 px-6 py-3 rounded-full font-semibold transition duration-300 text-black"
        >
          <i class="fab fa-youtube"></i> &nbsp; Subscribe on YouTube
        </a>
        <a
          [href]="spotifyLink"
          target="_blank"
          class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded-full font-semibold transition duration-300"
        >
          <i class="fab fa-spotify"></i> &nbsp; Follow on Spotify
        </a>
      </div>
      <p class="text-gray-400 text-sm">
        © 2024 The Geeky Pod. All rights reserved.
      </p>
    </div>
  </div>
</footer>
